# Build do app do iPhone do Venda Perfeita e envio pro TestFlight.
#
# Este arquivo mora no repo público vp-releases (.github/workflows/ios.yml),
# pelo mesmo motivo do mac.yml: lá o runner macOS é grátis. A cópia em
# venda-perfeita/mobile/ci/ios.yml é a fonte; mudou aqui, copia pra lá.
#   - o checkout usa SOURCE_SSH_KEY, chave de deploy só leitura do venda-perfeita;
#   - a tela mostra só as linhas "==>" e "ERRO" do build-ios.sh. O log completo
#     sobe cifrado e abre com `bash desktop/scripts/mac-ci.sh log <id do run>`.
#
# Sem gatilho de pull request: PR de fork nunca chega perto dos secrets.
#
# Secrets:
#   SOURCE_SSH_KEY, BUILD_LOG_KEY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID (já existem, do Mac)
#   IOS_CERTIFICATE, IOS_CERTIFICATE_PASSWORD, IOS_PROVISIONING_PROFILE
#   (o mobile/scripts/ios-ci.sh do venda-perfeita preenche os três)

name: iOS

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão (ex: 1.0.0). Vazio = a do mobile/package.json"
        required: false
      ref:
        description: "Branch ou commit do venda-perfeita"
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: ios
  cancel-in-progress: false

jobs:
  build:
    name: Build iOS e TestFlight
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Código do venda-perfeita
        uses: actions/checkout@v4
        with:
          repository: ThiagoC0STA/venda-perfeita
          ref: ${{ inputs.ref || 'main' }}
          ssh-key: ${{ secrets.SOURCE_SSH_KEY }}
          path: src
          persist-credentials: false
          sparse-checkout: mobile

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build, assinatura e envio
        env:
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set +e
          bash src/mobile/scripts/build-ios.sh 2>&1 | tee build.log | grep --line-buffered -E '^(==>|ERRO)'
          exit "${PIPESTATUS[0]}"

      # Roda mesmo com falha: é quando o log mais faz falta. O texto puro nunca
      # sobe; sem BUILD_LOG_KEY o passo só apaga o log.
      - name: Log cifrado
        if: always()
        env:
          BUILD_LOG_KEY: ${{ secrets.BUILD_LOG_KEY }}
        run: |
          if [[ -f build.log && -n "$BUILD_LOG_KEY" ]]; then
            OPENSSL="$(brew --prefix openssl@3)/bin/openssl"
            [[ -x "$OPENSSL" ]] || brew install openssl@3 >/dev/null
            "$OPENSSL" enc -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -salt \
              -in build.log -out build.log.enc -pass env:BUILD_LOG_KEY
          fi
          rm -f build.log

      - name: Sobe o log cifrado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log.enc
          if-no-files-found: ignore
          retention-days: 7
